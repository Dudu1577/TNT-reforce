name: Build TNTReinforced JAR

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then echo 'ZIP not found'; exit 1; fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          BUILD_FILE=$(find extracted -type f -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then echo 'build.gradle not found inside ZIP'; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build plugin
        run: gradle --no-daemon clean build
        working-directory: ${{ env.PROJECT_DIR }}
      - name: Save JAR for download
        uses: actions/upload-artifact@v4
        with:
          name: TNTReinforced-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
